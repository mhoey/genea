<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genea — Interaktiv slægtstræsvisning</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/tree.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/modal.css">
</head>
<body>
  <div id="app">
    <!-- Top Application Bar -->
    <header class="app-header">
      <a href="#" class="brand">
        <span class="brand-icon">G</span>
        <span>Genea Arkiv</span>
      </a>

      <!-- Unified Search, Selected Person & Quick Actions in Header -->
      <div class="header-focus-group">
        <div class="search-container">
          <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input
              type="search"
              id="focus-person-input"
              class="search-input"
              placeholder="Fokusér på person..."
              autocomplete="off"
              aria-label="Fokusér på person efter navn"
            >
          </div>
          <div id="search-results" class="search-results" role="region" aria-live="polite"></div>
        </div>
        <button id="btn-header-zoom-person" class="header-action-btn" title="Centrér og zoom ind på valgt person">
          ⌖ Zoom til person
        </button>
        <button id="btn-header-person-details" class="header-action-btn header-action-btn-primary" title="Åbn biografi, tidslinje og relationer for valgt person">
          Biografi &amp; detaljer
        </button>
      </div>

      <!-- Header Actions: View Modes & Theme -->
      <div class="header-actions">
        <div class="view-toggle" role="group" aria-label="Visningstilstand">
          <button id="btn-view-hourglass" class="view-btn" title="Timeglas slægtsvisning">Timeglas</button>
          <button id="btn-view-network" class="view-btn active" title="Visning af alle generationer">Alle familier</button>
        </div>
        <button id="btn-toggle-theme" class="btn-icon" title="Skift mørkt/lyst tema" aria-label="Skift tema">🌙</button>
      </div>
    </header>

    <!-- Main Interactive Tree Viewport -->
    <main class="viewport-container" id="viewport-container">
      <svg id="tree-svg" xmlns="http://www.w3.org/2000/svg" role="application" aria-label="Interaktivt slægtstræ">
        <defs>
          <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.6"/>
          </filter>
        </defs>
        <g id="tree-root">
          <g id="panels-layer"></g>
          <g id="edges-layer"></g>
          <g id="nodes-layer"></g>
        </g>
      </svg>

      <!-- Synchronized Virtual Scrollbars -->
      <div id="scrollbar-h" class="scrollbar-track scrollbar-h" aria-label="Vandret rulning">
        <div id="thumb-h" class="scrollbar-thumb"></div>
      </div>
      <div id="scrollbar-v" class="scrollbar-track scrollbar-v" aria-label="Lodret rulning">
        <div id="thumb-v" class="scrollbar-thumb"></div>
      </div>

      <!-- Minimap Radar Navigator -->
      <div class="minimap-container" title="Minikort">
        <canvas id="minimap-canvas" width="180" height="120"></canvas>
        <div id="minimap-viewport"></div>
      </div>

      <!-- Floating Controls Toolbar -->
      <aside class="controls-toolbar" id="controls-toolbar" aria-label="Navigationsknapper">
        <!-- Directional Pan Buttons -->
        <div class="pan-grid">
          <div></div>
          <button class="ctrl-btn" id="btn-pan-up" title="Panorér op" aria-label="Panorér op">▲</button>
          <div></div>
          <button class="ctrl-btn" id="btn-pan-left" title="Panorér til venstre" aria-label="Panorér til venstre">◀</button>
          <button class="ctrl-btn" id="btn-pan-down" title="Panorér ned" aria-label="Panorér ned">▼</button>
          <button class="ctrl-btn" id="btn-pan-right" title="Panorér til højre" aria-label="Panorér til højre">▶</button>
        </div>

        <div class="controls-divider"></div>

        <!-- Zoom Controls -->
        <div class="controls-group">
          <button class="ctrl-btn" id="btn-zoom-in" title="Zoom ind (+20%)" aria-label="Zoom ind">+</button>
          <button class="ctrl-btn zoom-indicator-btn" id="btn-zoom-reset" title="Klik for at nulstille zoom til 100%">100%</button>
          <button class="ctrl-btn" id="btn-zoom-out" title="Zoom ud (-20%)" aria-label="Zoom ud">−</button>
        </div>

        <div class="controls-divider"></div>

        <!-- Fit and Center Controls -->
        <div class="controls-group">
          <button class="ctrl-btn" id="btn-fit-screen" title="Tilpas hele træet til skærmen" aria-label="Tilpas til skærm">⛶</button>
          <button class="ctrl-btn" id="btn-center-selected" title="Centrér visning på valgt person" aria-label="Centrér på valgt person">⌖</button>
        </div>
      </aside>
    </main>
  </div>

  <!-- Person Details Modal Dialog -->
  <dialog id="person-dialog" class="person-modal" aria-labelledby="modal-person-name">
    <div class="modal-content">
      <header class="modal-header">
        <div class="modal-title-group">
          <h2 id="modal-person-name">Personnavn</h2>
          <div id="modal-badges-container"></div>
        </div>
        <button class="modal-close-btn" aria-label="Luk dialog">&times;</button>
      </header>

      <div class="modal-body">
        <!-- Demographics & Names -->
        <section class="modal-section">
          <h3>Navne og identitet</h3>
          <table class="details-table" id="modal-demographics-table"></table>
        </section>

        <!-- Life Events Timeline -->
        <section class="modal-section">
          <h3>Tidslinje over livsbegivenheder</h3>
          <ol class="events-timeline" id="modal-events-timeline"></ol>
        </section>

        <!-- Family Relationships -->
        <section class="modal-section">
          <h3>Familierelationer</h3>
          <div class="relations-grid">
            <div class="relation-card">
              <h4>Forældre</h4>
              <ul id="modal-parents-list"></ul>
            </div>
            <div class="relation-card">
              <h4>Ægtefæller og partnere</h4>
              <ul id="modal-spouses-list"></ul>
            </div>
            <div class="relation-card">
              <h4>Børn</h4>
              <ul id="modal-children-list"></ul>
            </div>
          </div>
        </section>

        <!-- Notes & Sources -->
        <section class="modal-section">
          <h3>Noter og kilder</h3>
          <div id="modal-notes" class="modal-notes"></div>
          <ul id="modal-sources-list" class="sources-list"></ul>
        </section>
      </div>

      <footer class="modal-footer">
        <button class="btn btn-primary" id="btn-center-tree">Centrér i træ</button>
        <button class="btn btn-secondary" id="btn-close-modal">Luk</button>
      </footer>
    </div>
  </dialog>

  <!-- Pre-bundled Data (fallback or local file browsing without CORS issues) -->
  <script src="data.js"></script>
  <!-- Application Entrypoint -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
