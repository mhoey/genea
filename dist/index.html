<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genea — Interactive Genealogy Tree Viewer</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/tree.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/modal.css">
</head>
<body>
  <div id="app">
    <!-- Top Application Bar -->
    <header class="app-header">
      <a href="#" class="brand">
        <span class="brand-icon">G</span>
        <span>Genea Archive</span>
      </a>

      <!-- Focus on Person Real-time Search -->
      <div class="search-container">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input
            type="search"
            id="focus-person-input"
            class="search-input"
            placeholder="Focus on Person..."
            autocomplete="off"
            aria-label="Focus on person by name or ID"
          >
        </div>
        <div id="search-results" class="search-results" role="region" aria-live="polite"></div>
      </div>

      <!-- Header Actions: View Modes & Theme -->
      <div class="header-actions">
        <div class="view-toggle" role="group" aria-label="View layout mode">
          <button id="btn-view-hourglass" class="view-btn active" title="Hourglass lineage view">Hourglass</button>
          <button id="btn-view-network" class="view-btn" title="All generations view">All Families</button>
        </div>
        <button id="btn-toggle-theme" class="btn-icon" title="Toggle dark/light theme" aria-label="Toggle theme">🌙</button>
      </div>
    </header>

    <!-- Main Interactive Tree Viewport -->
    <main class="viewport-container" id="viewport-container">
      <svg id="tree-svg" xmlns="http://www.w3.org/2000/svg" role="application" aria-label="Interactive family tree graph">
        <defs>
          <filter id="node-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.6"/>
          </filter>
        </defs>
        <g id="tree-root">
          <g id="edges-layer"></g>
          <g id="nodes-layer"></g>
        </g>
      </svg>

      <!-- Synchronized Virtual Scrollbars -->
      <div id="scrollbar-h" class="scrollbar-track scrollbar-h" aria-label="Horizontal scroll">
        <div id="thumb-h" class="scrollbar-thumb"></div>
      </div>
      <div id="scrollbar-v" class="scrollbar-track scrollbar-v" aria-label="Vertical scroll">
        <div id="thumb-v" class="scrollbar-thumb"></div>
      </div>

      <!-- Minimap Radar Navigator -->
      <div class="minimap-container" title="Minimap radar view">
        <canvas id="minimap-canvas" width="180" height="120"></canvas>
        <div id="minimap-viewport"></div>
      </div>

      <!-- Floating Controls Toolbar -->
      <aside class="controls-toolbar" id="controls-toolbar" aria-label="Tree navigation controls">
        <!-- Directional Pan Buttons -->
        <div class="pan-grid">
          <div></div>
          <button class="ctrl-btn" id="btn-pan-up" title="Pan Up" aria-label="Pan up">▲</button>
          <div></div>
          <button class="ctrl-btn" id="btn-pan-left" title="Pan Left" aria-label="Pan left">◀</button>
          <button class="ctrl-btn" id="btn-pan-down" title="Pan Down" aria-label="Pan down">▼</button>
          <button class="ctrl-btn" id="btn-pan-right" title="Pan Right" aria-label="Pan right">▶</button>
        </div>

        <div class="controls-divider"></div>

        <!-- Zoom Controls -->
        <div class="controls-group">
          <button class="ctrl-btn" id="btn-zoom-in" title="Zoom In (+20%)" aria-label="Zoom in">+</button>
          <button class="ctrl-btn zoom-indicator-btn" id="btn-zoom-reset" title="Click to reset zoom to 100%">100%</button>
          <button class="ctrl-btn" id="btn-zoom-out" title="Zoom Out (-20%)" aria-label="Zoom out">−</button>
        </div>

        <div class="controls-divider"></div>

        <!-- Fit and Center Controls -->
        <div class="controls-group">
          <button class="ctrl-btn" id="btn-fit-screen" title="Fit Entire Tree to Screen" aria-label="Fit to screen">⛶</button>
          <button class="ctrl-btn" id="btn-center-selected" title="Center View on Selected Person" aria-label="Center on selected person">⌖</button>
        </div>
      </aside>
    </main>
  </div>

  <!-- Person Details Modal Dialog -->
  <dialog id="person-dialog" class="person-modal" aria-labelledby="modal-person-name">
    <div class="modal-content">
      <header class="modal-header">
        <div class="modal-title-group">
          <h2 id="modal-person-name">Person Name</h2>
          <div id="modal-badges-container"></div>
        </div>
        <button class="modal-close-btn" aria-label="Close dialog">&times;</button>
      </header>

      <div class="modal-body">
        <!-- Demographics & Names -->
        <section class="modal-section">
          <h3>Names & Identity</h3>
          <table class="details-table" id="modal-demographics-table"></table>
        </section>

        <!-- Life Events Timeline -->
        <section class="modal-section">
          <h3>Life Events Timeline</h3>
          <ol class="events-timeline" id="modal-events-timeline"></ol>
        </section>

        <!-- Family Relationships -->
        <section class="modal-section">
          <h3>Family Relationships</h3>
          <div class="relations-grid">
            <div class="relation-card">
              <h4>Parents</h4>
              <ul id="modal-parents-list"></ul>
            </div>
            <div class="relation-card">
              <h4>Spouses & Partners</h4>
              <ul id="modal-spouses-list"></ul>
            </div>
            <div class="relation-card">
              <h4>Children</h4>
              <ul id="modal-children-list"></ul>
            </div>
          </div>
        </section>

        <!-- Notes & Sources -->
        <section class="modal-section">
          <h3>Notes & Sources</h3>
          <div id="modal-notes" class="modal-notes"></div>
          <ul id="modal-sources-list" class="sources-list"></ul>
        </section>
      </div>

      <footer class="modal-footer">
        <button class="btn btn-primary" id="btn-center-tree">Center in Tree</button>
        <button class="btn btn-secondary" id="btn-close-modal">Close</button>
      </footer>
    </div>
  </dialog>

  <!-- Pre-bundled Data (fallback or local file browsing without CORS issues) -->
  <script src="data.js"></script>
  <!-- Application Entrypoint -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
